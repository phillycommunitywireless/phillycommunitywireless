{{ if .IsTranslated }}
<ul id="translations" class="site-menu-list ph0 mv0 lh-copy tc flex flex-column flex-row-l items-center">
    {{ range .Translations }}
    <li class="menu-item menu-item-top list relative">
        <a class="menu-link menu-link-top" href="{{ .RelPermalink }}">{{ .Language.LanguageName }}</a>
    </li>
    {{ end}}
</ul>
{{ end }}
