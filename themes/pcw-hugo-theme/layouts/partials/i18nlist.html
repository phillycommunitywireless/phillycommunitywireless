{{ if .IsTranslated }}
<ul id="translations" class="ph0 mv0 lh-copy tc flex flex-column flex-row-l items-center">
    {{ range .Translations }}
    <li class="list fw4 dib br3 pt2 pb1">
        <a class="hover-black no-underline white" href="{{ .RelPermalink }}">{{ .Language.LanguageName }}</a>
    </li>
    {{ end}}
</ul>
{{ end }}
