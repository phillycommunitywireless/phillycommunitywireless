<div id="mc_embed_shell">
    <link href="//cdn-images.mailchimp.com/embedcode/classic-061523.css" rel="stylesheet" type="text/css">
    <style type="text/css">
        #mc_embed_signup {
            background: #fff;
            false;
            clear: left;
            /* font: 14px Helvetica, Arial, sans-serif; */
            max-width: 600px;
        }

        #mc-embedded-subscribe-form {
            width: 100%;
        }

        /* override default style */
        #mc_embed_signup .indicates-required{
            margin-right: 0;
        }

        #mc_embed_signup .mc-field-group {
            width: 100%;
        }

        #mc_embed_signup .button{
            background-color: var(--primary);   
            margin-bottom: 0; 
            margin-right: 0;
            font-size: 1.5rem; 
            font-weight: 700;
            text-align: center;
            border-radius: 0;
            width: 150px;
            height: 50px;
        }

        #mc_embed_signup .button:hover{
            background-color: var(--primary);
            text-decoration: underline;
        }

        /* Mailchimp's required-field asterisk is #e85c41, which is 3.5:1 on white
           and fails WCAG AA for normal text. The brand blue clears it at 4.85:1. */
        #mc_embed_signup .asterisk {
            color: var(--primary);
        }

        /* Add your own Mailchimp form style overrides in your site stylesheet or in this style block.
         We recommend moving this block and the preceding CSS link to the HEAD of your HTML file. */
    </style>
    <div id="mc_embed_signup" class="flex flex-row center ph3">
        <form
            action="https://phillycommunitywireless.us5.list-manage.com/subscribe/post?u=7a97e4278a5833f5505a85940&amp;id=6af414f631&amp;f_id=007dbaedf0"
            method="post" id="mc-embedded-subscribe-form" name="mc-embedded-subscribe-form" class="validate"
            target="_blank">
            <div id="mc_embed_signup_scroll">
                <!-- <h2>Subscribe to our Newsletter!</h2> -->
                <div class="indicates-required"><span class="asterisk">*</span> {{ i18n "newsletterRequired" }}</div>

                <!-- fname, lname -->
                <div class="flex flex-column flex-row-ns">
                    <div style="display: inline-block; position: initial;"
                        class="mc-field-group w-100 w-50-ns pb0 pr2-ns">
                        <label class="calibre f4" for="mce-FNAME">{{ i18n "newsletterFirstName" }} </label><input type="text" name="FNAME"
                            class=" text" id="mce-FNAME" value="">
                    </div>
                    <div style="display: inline-block; position: initial; padding-bottom: 0px;"
                        class="mc-field-group w-100 w-50-ns pb0 pl2-ns">
                        <label class="calibre f4" for="mce-LNAME">{{ i18n "newsletterLastName" }} </label><input type="text" name="LNAME"
                            class=" text" id="mce-LNAME" value="">
                    </div>
                </div>

                <!-- email address -->
                <div class="flex flex-column">
                    <div class="mc-field-email mc-field-group pb0">
                        <label class="calibre f4" for="mce-EMAIL">{{ i18n "emailAddress" }} <span class="asterisk">*</span>
                        </label>
                        <input type="email" name="EMAIL" class="required email" id="mce-EMAIL" value="" required="">
                    </div>
                </div>

                <div id="mce-responses" class="clear foot">
                    <div class="response" id="mce-error-response" style="display: none;"></div>
                    <div class="response" id="mce-success-response" style="display: none;"></div>
                </div>
                <div aria-hidden="true" style="position: absolute; left: -5000px;">
                    <!-- real people should not fill this in and expect good things - do not remove this or
                    risk form bot signups -->
                    <input type="text" name="b_7a97e4278a5833f5505a85940_6af414f631" tabindex="-1" value="">
                </div>
                <div class="optionalParent flex items-center justify-center">
                    <div style="display: flex !important;" class="clear foot flex items-center justify-center">
                
                        <!-- match styling of other buttons on site -->
                        <!-- <input type="submit" name="subscribe" id="mc-embedded-subscribe" class="button" value="Subscribe"> -->
                        <input type="submit" name="subscribe" id="mc-embedded-subscribe"
                        class="button"
                        value="{{ i18n "newsletterSubscribe" }}">

                        <!-- referral badge -->
                        <!-- <p style="margin: 0px auto;"><a href="http://eepurl.com/iMTyNg"
                                title="Mailchimp - email marketing made easy and fun"><span
                                    style="display: inline-block; background-color: transparent; border-radius: 4px;"><img
                                        class="refferal_badge"
                                        src="https://digitalasset.intuit.com/render/content/dam/intuit/mc-fe/en_us/images/intuit-mc-rewards-text-dark.svg"
                                        alt="Intuit Mailchimp"
                                        style="width: 220px; height: 40px; display: flex; padding: 2px 0px; justify-content: center; align-items: center;"></span></a>
                        </p> -->
                    </div>
                </div>
            </div>
        </form>
    </div>
    <script>
        // Mailchimp's validation script (~140KB, bundles jQuery) is only needed once
        // someone uses the form, so fetch it on first interaction instead of on page
        // load. Until it loads, the form still submits normally to Mailchimp.
        (function () {
            var form = document.getElementById('mc-embedded-subscribe-form');
            if (!form) return;
            // Field map mc-validate.js reads when showing per-field errors.
            window.fnames = ['EMAIL', 'FNAME', 'LNAME'];
            window.ftypes = ['email', 'text', 'text'];
            var requested = false;
            function loadValidation() {
                if (requested) return;
                requested = true;
                var script = document.createElement('script');
                script.src = 'https://s3.amazonaws.com/downloads.mailchimp.com/js/mc-validate.js';
                script.onload = function () {
                    // Validation messages in the page's language.
                    jQuery.extend(jQuery.validator.messages, {
                        required: {{ i18n "newsletterFieldRequired" }},
                        email: {{ i18n "newsletterInvalidEmail" }}
                    });
                    window.$mcj = jQuery.noConflict(true);
                };
                document.body.appendChild(script);
            }
            ['focusin', 'pointerdown', 'touchstart'].forEach(function (type) {
                form.addEventListener(type, loadValidation, { passive: true });
            });
        })();
    </script>
</div>
