<div class="funder-card nested-copy-line-height lh-copy f3 nested-links nested-img near-black">
    {{- /* Logos display at 100px (custom.css), so only small, lazy-loaded versions are needed. */}}
    {{ partial "responsive-image.html" (dict "src" .img_src "alt" .img_alt "sizes" "100px" "widths" (slice 100 200 300)) }}
    <div class="funder-desc">
        {{- with .prefix }}{{ . }} {{ end -}}
        <a href="{{ .link }}">{{ .link_text }}</a>{{ .suffix }}
    </div>
</div>
