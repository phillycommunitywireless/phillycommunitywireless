{{ define "header" }}{{ partial "page-header.html" . }}{{ end }}
{{ define "main" }}
<section class="pif-header">
  <svg class="pif-signal" viewBox="0 0 600 400" preserveAspectRatio="xMaxYMax slice" aria-hidden="true" focusable="false">
    <g fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M510 400 A 90 90 0 0 1 600 310" /><path d="M440 400 A 160 160 0 0 1 600 240" opacity=".85" /><path d="M370 400 A 230 230 0 0 1 600 170" opacity=".7" /><path d="M300 400 A 300 300 0 0 1 600 100" opacity=".55" /><path d="M230 400 A 370 370 0 0 1 600 30" opacity=".4" /><path d="M160 400 A 440 440 0 0 1 600 -40" opacity=".28" /><path d="M90 400 A 510 510 0 0 1 600 -110" opacity=".18" />
    </g>
  </svg>
  <div class="pif-header-inner mw7 center ph3 ph4-ns">
    {{ with .Params.kicker }}<p class="pif-kicker">{{ . }}</p>{{ end }}
    <h1 class="pif-title">{{ .Title }}</h1>
    {{ with .Params.lead }}<p class="pif-lead">{{ . }}</p>{{ end }}
  </div>
</section>
<div class="flex-l flex-column mt2 mw8 center">
  <article class="pif-body center cf pv5-ns ph3 ph4-ns mw7">
    <div class="nested-copy-line-height lh-copy f3 nested-links nested-img near-black">
      {{ .Content }}
    </div>
  </article>
</div>
{{ end }}
