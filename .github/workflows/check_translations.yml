name: Check Drift between English and Spanish versions 

on:
  workflow_dispatch:  
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          # full history, to compare when each English and Spanish page last changed
          fetch-depth: 0
      - run: python .github/scripts/check_translations.py ${{ github.base_ref && format('origin/{0}', github.base_ref) || '' }}
